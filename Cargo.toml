[package]
name = "quanstants"
version = "0.2.0"
edition = "2024"

[lib]
name = "quanstants"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["rlib", "cdylib"]

[dependencies]
bigdecimal = "0.4.10"
indexmap = "2.12.1"
num-rational = "0.4.2"
num-traits = "0.2.19"
regex = "1.12.2"
scinum = { version = "0.1.0", path = "../scinum" }
serde_with = "3.15.1"
toml = "0.9.8"

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.pyo3]
optional = true
version = "0.26.0"
# "abi3-py38" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.8
features = ["abi3-py310", "bigdecimal"]

#[dependencies.derive_more]
#version = "2.0.1"
#features = ["add", "mul"]

[features]
default = []
python = ["dep:pyo3", "extension-module"]
extension-module = ["pyo3/extension-module"]
