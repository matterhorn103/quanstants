[package]
name = "quanstants"
version = "0.1.0"
edition = "2021"

[lib]
name = "quanstants"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
num-rational = "0.4.2"
num-traits = "0.2.19"
rust_decimal_macros = "1.38.0"
serde_with = "3.15.1"

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.rust_decimal]
version = "1.38.0"
features = ["maths"]

[dependencies.pyo3]
version = "0.26.0"
# "abi3-py38" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.8
features = ["abi3-py310", "rust_decimal"]
rust_decimal = "1.38.0"

#[dependencies.derive_more]
#version = "2.0.1"
#features = ["add", "mul"]

[features]
default = []
python = ["extension-module"]
extension-module = ["pyo3/extension-module"]
